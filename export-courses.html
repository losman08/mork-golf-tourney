<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morks — Course Library Export</title>
<style>
 body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:940px;margin:2rem auto;padding:0 1rem;color:#1a2e22;background:#f7f5ef;}
 h1{font-size:1.3rem;margin-bottom:.2rem;}
 .card{background:#fff;border:1px solid #dcd8cc;border-radius:10px;padding:1rem 1.2rem;margin:1rem 0;box-shadow:0 1px 3px rgba(0,0,0,.06);}
 button{background:#1f5138;color:#fff;border:none;padding:.6rem 1.1rem;border-radius:8px;font-size:.95rem;cursor:pointer;font-weight:600;}
 button:disabled{opacity:.45;cursor:not-allowed;}
 button.alt{background:#c9a227;color:#1a2e22;}
 input{padding:.55rem;border:1px solid #ccc;border-radius:6px;font-size:.95rem;width:100%;box-sizing:border-box;margin:.3rem 0;}
 table{border-collapse:collapse;width:100%;font-size:.85rem;margin-top:.6rem;}
 th,td{border:1px solid #e2ded2;padding:.35rem .5rem;text-align:left;}
 th{background:#eee9dd;position:sticky;top:0;}
 .ok{color:#1f7a3f;font-weight:600;}
 .no{color:#b23b3b;font-weight:600;}
 .muted{color:#777;font-size:.85rem;}
 code{background:#eee9dd;padding:1px 5px;border-radius:4px;}
 #status{white-space:pre-wrap;font-size:.9rem;}
 .hide{display:none;}
 #table-wrap{max-height:60vh;overflow:auto;}
</style>
</head>
<body>
<h1>Morks Golf — Course Library Export</h1>
<p class="muted">Reads the <code>courseLibrary</code> collection and downloads it. Read-only — this page never writes anything.</p>

<div class="card" id="auth-card">
  <div id="status">Connecting…</div>
  <div id="signin" class="hide">
    <p>Sign in with an admin account to read the library:</p>
    <input id="email" type="email" placeholder="admin email" autocomplete="username">
    <input id="pass" type="password" placeholder="password" autocomplete="current-password">
    <button id="signin-btn">Sign in &amp; load</button>
  </div>
</div>

<div class="card hide" id="result-card">
  <div id="summary"></div>
  <p style="margin-top:.9rem;">
    <button id="dl-json">Download JSON</button>
    <button id="dl-csv" class="alt">Download CSV (flat view)</button>
  </p>
  <div id="table-wrap"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDyAtsNMVVC00M_wuVedqIkBOLclOpp5-0",
  authDomain: "mork-golf-tourney.firebaseapp.com",
  databaseURL: "https://mork-golf-tourney-default-rtdb.firebaseio.com",
  projectId: "mork-golf-tourney",
  storageBucket: "mork-golf-tourney.firebasestorage.app",
  messagingSenderId: "559245924413",
  appId: "1:559245924413:web:7ed417e65886552e0c3254"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const $ = id => document.getElementById(id);
let COURSES = [];

const setStatus = m => { $('status').textContent = m; };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

// A stroke index is valid only as a complete 1–18 set, one rank per hole.
function validSI(hc){
  if(!Array.isArray(hc) || hc.length!==18) return false;
  const seen={};
  for(const x of hc){ const v=Number(x); if(!Number.isInteger(v)||v<1||v>18||seen[v]) return false; seen[v]=true; }
  return true;
}

async function loadLibrary(){
  setStatus('Loading course library…');
  const snap = await getDocs(collection(db,'courseLibrary'));
  COURSES = snap.docs.map(d => Object.assign({ id:d.id }, d.data()));
  COURSES.sort((a,b) => String(a.name||'').localeCompare(String(b.name||'')));
  render();
}

function render(){
  $('signin').classList.add('hide');
  $('result-card').classList.remove('hide');
  const withSI = COURSES.filter(c => validSI(c.holeHcp)).length;
  setStatus('Loaded ' + COURSES.length + ' courses.');
  $('summary').innerHTML =
    '<strong>' + COURSES.length + '</strong> courses &middot; ' +
    '<span class="ok">' + withSI + '</span> with a valid stroke index &middot; ' +
    '<span class="no">' + (COURSES.length - withSI) + '</span> missing SI';
  const rows = COURSES.map(c => {
    const si = validSI(c.holeHcp);
    const loc = [c.city, c.state].filter(Boolean).join(', ');
    const tees = Array.isArray(c.tees) ? c.tees.length : 0;
    return '<tr><td>'+esc(c.name||'(unnamed)')+'</td><td>'+esc(loc)+'</td><td>'+esc(c.par!=null?c.par:'')+
           '</td><td>'+tees+'</td><td class="'+(si?'ok':'no')+'">'+(si?'yes':'—')+'</td></tr>';
  }).join('');
  $('table-wrap').innerHTML =
    '<table><thead><tr><th>Name</th><th>Location</th><th>Par</th><th>Tees</th><th>SI on file</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function download(filename, text, type){
  const blob = new Blob([text], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

$('dl-json').onclick = () =>
  download('courseLibrary.json', JSON.stringify(COURSES, null, 2), 'application/json');

$('dl-csv').onclick = () => {
  // One row per course; SI flattened to a space-joined string. Quick-read view, not a round-trip format.
  const head = ['id','name','city','state','par','tees','holeHcp'];
  const lines = [head.join(',')];
  COURSES.forEach(c => {
    const hc = Array.isArray(c.holeHcp) ? c.holeHcp.join(' ') : '';
    const row = [c.id, c.name, c.city, c.state, c.par, (Array.isArray(c.tees)?c.tees.length:''), hc]
      .map(v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"');
    lines.push(row.join(','));
  });
  download('courseLibrary.csv', lines.join('\n'), 'text/csv');
};

$('signin-btn').onclick = async () => {
  try{
    setStatus('Signing in…');
    await signInWithEmailAndPassword(auth, $('email').value.trim(), $('pass').value);
    await loadLibrary();
  }catch(e){
    setStatus('Sign-in failed: ' + (e.code || e.message));
  }
};

// Try reading without sign-in first; if the rules block it, reveal the sign-in form.
(async () => {
  try{
    await loadLibrary();
  }catch(e){
    setStatus('Couldn\u2019t read the library' + (e.code ? ' (' + e.code + ')' : '') + '. Sign in below to continue.');
    $('signin').classList.remove('hide');
  }
})();
</script>
</body>
</html>
